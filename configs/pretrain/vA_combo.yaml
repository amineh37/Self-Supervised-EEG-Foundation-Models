# Option A (#1 + #2): attention-guided masking + augmented views.
# Tune SEQUENTIALLY (fix #2, search #1's tau), never jointly. See README_IMPROVED.
# Run from pretrain/:
#   python run_pretrain_improved.py --config ../configs/pretrain/vA_combo.yaml

seed: 7

model:
  preset: vA_combo
  tag: tiny
  transformer: crisscross
  mask_ratio: 0.5

improvements:
  attn_tau_start: 1.0
  attn_tau_min: 0.1
  attn_tau_epochs: 15
  attn_imp_floor: 0.05
  # use_vicreg: true   # enable only if teacher/student emb std collapses in logs

data:
  input_mode: pretoken
  data_backend: lmdb
  train_lmdb: ${DATA}/STELAR/data/pretrain/train_90pct
  valid_lmdb: ${DATA}/STELAR/data/pretrain/val_10pct
  montage: "19"
  batch_size: 64
  num_workers: 8

trainer:
  max_epochs: 30
  pretrain_max_lr: 1.0e-4
  devices: "0"

logging:
  log_root: ./logs
  logger: both
  wandb: false
  wandb_project: stelar
  wandb_tags: pretrain,vA_combo,optionA
