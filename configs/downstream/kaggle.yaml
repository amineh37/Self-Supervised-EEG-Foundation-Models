# KaggleERN fine-tuning of STELAR (error-related negativity, 5-fold). Reproduces Table 7 (KaggleERN).
# Run from the project root (architecture/):
#   python src/downstream/run_kaggle.py --config configs/downstream/kaggle.yaml

seed: 42

task:
  scheme: stelar_patch_adapt
  head_type: eegpt_probe
  kfold: 5

data:
  kaggle_ern_path: ${DATA}/KaggleERN_stelar   # edit
  seq_len: 400
  patch: 50
  scale_div: 1.0
  num_workers: 4

model:
  pretrain_ckpt: ${CKPT}/stelar_base.ckpt     # edit

trainer:
  epochs: 50
  devices: "0"

logging:
  log_root: ./logs
  logger: both
  wandb: false
  wandb_project: stelar
  wandb_tags: downstream,kaggle
