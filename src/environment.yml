name: stelar
channel_priority: flexible
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.9
  - pip

  # PyTorch + CUDA runtime (11.8 is broadly compatible on clusters)
  - pytorch=2.1.2
  - torchvision=0.16.2
  - torchaudio=2.1.2
  - pytorch-cuda=11.8

  # Numerics / data
  - numpy=1.26.*
  - scipy=1.11.*
  - pandas=2.2.*          # pandas 2.x for xarray
  - xarray=2024.7.0
  - scikit-learn=1.4.*    # (works with py39 + numpy 1.26)

  # DL ecosystem
  - pytorch-lightning=2.5.3
  - torchmetrics=1.8.*    # works with PL 2.5.x
  - tokenizers=0.21.4
  - safetensors=0.6.*

  # IO / utils (let conda pick versions)
  - h5py
  - ffmpeg
  - opencv                 # drop if not needed
  - yaml

  - pip:
      - transformers==4.55.4
      - braindecode==0.8.1
      - einops==0.8.1
      - mne==1.8.0
      - mne-bids==0.15.0
      - mne-connectivity==0.7.0
      - moabb==1.2.0
      - timm==1.0.19
      - tensorboard==2.20.0
      - tensorboardx==2.6.4
      - line-profiler==4.2.0
      - memory-profiler==0.61.0
      - torcheeg==1.1.3
      - torchinfo==1.8.0
      # Data backend + experiment tracking + YAML config layer
      - lmdb==1.5.1
      - pyyaml==6.0.2
      - wandb==0.18.7

